steps:
  # Install dependencies
  - name: "node:22-slim"
    entrypoint: "corepack"
    args: ["enable"]

  - name: "node:22-slim"
    entrypoint: "pnpm"
    args: ["install", "--frozen-lockfile"]

  # Typecheck
  - name: "node:22-slim"
    entrypoint: "pnpm"
    args: ["typecheck"]

  # Lint
  - name: "node:22-slim"
    entrypoint: "pnpm"
    args: ["lint"]

  # Unit tests
  - name: "node:22-slim"
    entrypoint: "pnpm"
    args: ["test"]

  # Build all
  - name: "node:22-slim"
    entrypoint: "pnpm"
    args: ["build"]

  # Build and push API Gateway container
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "infra/docker/api-gateway.Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/api-gateway:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/api-gateway:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/api-gateway"]

  # Build and push web-public container
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "infra/docker/web-public.Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/web-public:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/web-public:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/web-public"]

  # Build and push web-teams container
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "infra/docker/web-teams.Dockerfile"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/web-teams:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/web-teams:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/web-teams"]

  # Deploy to Cloud Run (staging)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "api-gateway"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/secretlink/api-gateway:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--tag=staging"
      - "--no-traffic"

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: "1200s"
