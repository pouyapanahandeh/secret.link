# Secretlink reverse proxy (nginx).
# Terminates TLS, serves as the single public entry point, and forwards to the
# PM2-managed Node processes on loopback ports. Copy to
# /etc/nginx/sites-available/secretlink and symlink into sites-enabled.

# ── Rate-limit-safe real client IP ───────────────────────────────────────────
# Overwrite (do NOT append) X-Forwarded-For so clients cannot spoof it. The API
# runs with app.proxy = true and keys rate limits on this value.
map $remote_addr $real_client_ip { default $remote_addr; }

# gzip for text responses (brotli via ngx_brotli if available).
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;

# Micro-cache zone for anonymous SSR pages (used by `location = /` below). Small
# and short-lived: it collapses traffic spikes onto a single origin render and
# lets nginx serve slightly-stale HTML if the Node process is busy or restarting.
proxy_cache_path /var/cache/nginx/secretlink levels=1:2 keys_zone=sl_cache:10m
                 max_size=200m inactive=60s use_temp_path=off;

# ── Public app: secretlink.life ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name secretlink.life www.secretlink.life;

    # ssl_certificate / ssl_certificate_key managed by certbot.

    # API — forward /v1 to the Koa gateway.
    location /v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events need buffering off and long timeouts.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Landing page — the highest-traffic anonymous route. Micro-cache it for a
    # few seconds ONLY. This is an exact match (`= /`) so dynamic routes like
    # /s/<id> (secret reveal), /live/<id>, and /<handle> are never cached.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache sl_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_key "$scheme$host$request_uri";
        # Never serve a cached page to, or store a response for, a logged-in
        # user (session cookie present) or any response that sets a cookie.
        proxy_cache_bypass $cookie_sl_token;
        proxy_no_cache $cookie_sl_token $upstream_http_set_cookie;
        # Collapse concurrent cache misses into a single upstream render.
        proxy_cache_lock on;
        # Resilience: serve stale HTML if the origin errors, times out, or is
        # mid-refresh, instead of showing the visitor an error.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Everything else — Remix SSR (web-public). Never cached.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache immutable build assets.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ── Admin app: admin.secretlink.life ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.secretlink.life;

    location /v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name secretlink.life www.secretlink.life admin.secretlink.life;
    return 301 https://$host$request_uri;
}
