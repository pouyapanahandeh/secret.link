# Secretlink reverse proxy (nginx) — public site (secretlink.life).
# This mirrors the live /etc/nginx/sites-available/secretlink. The admin vhost
# (admin.secretlink.life) is a separate, certbot-managed file and is not
# included here. TLS certs are managed by certbot.

# Micro-cache zone for the anonymous landing page (used by `location = /`). Small
# and short-lived: it collapses traffic spikes onto a single origin render and
# lets nginx serve slightly-stale HTML if the Node SSR process is busy or
# restarting. proxy_cache_path must live in the http context (this file is
# included within http {}).
proxy_cache_path /var/cache/nginx/secretlink levels=1:2 keys_zone=sl_cache:10m
                 max_size=200m inactive=60s use_temp_path=off;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    if ($host = www.secretlink.life) { return 301 https://$host$request_uri; }
    if ($host = secretlink.life)     { return 301 https://$host$request_uri; }

    listen 80;
    server_name secretlink.life www.secretlink.life;
    return 301 https://$host$request_uri;
}

# ── Public app: secretlink.life ──────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name secretlink.life www.secretlink.life;
    ssl_certificate     /etc/letsencrypt/live/secretlink.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secretlink.life/privkey.pem;

    client_max_body_size 50M;

    # SSE stream endpoint — no buffering, long timeout, never cached.
    location /v1/dms/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Secret chat SSE — same buffering rules as DM streams.
    location ~ ^/v1/chats/[^/]+/sse$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # API — forward /v1 to the Koa gateway.
    location /v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing page — the highest-traffic anonymous route. Micro-cache it for a
    # few seconds ONLY. This is an exact match (`= /`) so dynamic routes like
    # /s/<id> (secret reveal), /live/<id>, and /<handle> are never cached.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache sl_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_key "$scheme$host$request_uri";
        # Never serve a cached page to, or store a response for, a logged-in
        # user (session cookie present) or any response that sets a cookie.
        proxy_cache_bypass $cookie_sl_token;
        proxy_no_cache $cookie_sl_token $upstream_http_set_cookie;
        # Collapse concurrent cache misses into a single upstream render.
        proxy_cache_lock on;
        # Resilience: serve stale HTML if the origin errors, times out, or is
        # mid-refresh, instead of showing the visitor an error.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Fingerprinted build assets — long-lived cache (Remix/Vite hashed filenames).
    location ^~ /build/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Branding / favicon assets from the public folder.
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else — Remix SSR (web-public). Never cached; supports websockets.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
