<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Secret.link</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0f;
        color: #f4f4f5;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        color: #facc15;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        max-width: 22rem;
      }
    </style>
  </head>
  <body>
    <!-- Shown only if the remote server in capacitor.config.json is unreachable. -->
    <main>
      <h1>Secret.link</h1>
      <p>Can't reach secretlink.life right now. Check your connection and reopen the app.</p>
    </main>
  </body>
</html>
